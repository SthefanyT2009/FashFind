<script src="carrito.js"></script> <!-- Conecta el archivo donde está la lógica base del carrito (guardar, cargar, etc.) -->
<script>
document.addEventListener('DOMContentLoaded', function () { // Ejecuta todo cuando la página ya cargó para evitar errores con elementos

  /* ── Formatear número como precio colombiano ── */
  function formatearPrecio(n) { // Convierte números normales a formato de dinero
    return '$' + Number(n).toLocaleString('es-CO'); // Ej: 20000 → $20.000 (formato Colombia)
  }

  /* ── Dibujar la lista y calcular totales ── */
  function actualizarCarrito() { // Función principal que controla todo el carrito (mostrar, actualizar, calcular)
    var carrito = CartAPI.load(); // Carga los productos guardados en el navegador (para no perderlos)
    var lista   = document.getElementById('listaItems'); // Obtiene el contenedor donde se van a mostrar los productos

    /* Actualizar el número del ícono de bolsa */
    CartAPI.updateBadge(); // Actualiza el numerito del carrito (cantidad de productos)

    /* Si está vacío, mostrar mensaje */
    if (!carrito.length) { // Verifica si el carrito está vacío
      lista.innerHTML =
        '<div class="carrito-vacio">' +
          '<i class="fa-solid fa-bag-shopping"></i>' +
          '<p>Tu carrito está vacío</p>' +
          '<a href="../../index.php" class="boton-ir-tienda">Ir a la tienda</a>' +
        '</div>'; // Muestra mensaje de carrito vacío
      actualizarResumen(0); // Reinicia los valores del resumen a 0
      return; // Detiene la ejecución para no seguir con cálculos innecesarios
    }

    /* Construir el HTML de cada ítem */
    lista.innerHTML = carrito.map(function (item, indice) { // Recorre todos los productos y los dibuja en pantalla
      var subtotal = item.price * item.qty; // Calcula el subtotal por producto (precio * cantidad)
      return (
        '<div class="fila-item">' +

          /* Imagen / fondo de color */
          '<div class="imagen-item ' + (item.color || 'fondo-azul') + '">' + // Aplica color o uno por defecto
            '<i class="fa-solid fa-shirt"></i>' +
          '</div>' +

          /* Nombre, precio unitario y control de cantidad */
          '<div class="info-item">' +
            '<h4>' + item.name + '</h4>' + // Muestra nombre del producto
            '<p>Precio unitario: ' + formatearPrecio(item.price) + '</p>' + // Muestra precio formateado
            '<div class="control-cantidad">' +
              '<button class="boton-cantidad" data-indice="' + indice + '" data-delta="-1">−</button>' + // Botón para disminuir cantidad
              '<span class="numero-cantidad">' + item.qty + '</span>' + // Muestra cantidad actual
              '<button class="boton-cantidad" data-indice="' + indice + '" data-delta="1">+</button>' + // Botón para aumentar cantidad
            '</div>' +
          '</div>' +

          /* Subtotal del ítem y botón eliminar */
          '<div class="precio-item">' +
            '<span class="subtotal-item">' + formatearPrecio(subtotal) + '</span>' + // Muestra subtotal del producto
            '<button class="boton-eliminar" data-indice="' + indice + '">' + // Botón para eliminar producto
              '<i class="fa-solid fa-trash-can"></i>' +
            '</button>' +
          '</div>' +

        '</div>'
      );
    }).join(''); // Une todo el HTML generado en un solo string

    /* Botones de cantidad */
    lista.querySelectorAll('.boton-cantidad').forEach(function (btn) { // Selecciona todos los botones + y -
      btn.addEventListener('click', function () { // Evento al hacer clic
        var c = CartAPI.load(); // Carga carrito actual
        var i = parseInt(this.dataset.indice); // Obtiene el índice del producto
        c[i].qty = Math.max(1, c[i].qty + parseInt(this.dataset.delta)); // Modifica cantidad sin permitir menos de 1 (evita errores)
        CartAPI.save(c); // Guarda cambios en el navegador
        actualizarCarrito(); // Vuelve a renderizar el carrito actualizado
      });
    });

    /* Botones de eliminar ítem */
    lista.querySelectorAll('.boton-eliminar').forEach(function (btn) { // Selecciona botones eliminar
      btn.addEventListener('click', function () { // Evento clic
        var c = CartAPI.load(); // Carga carrito
        c.splice(parseInt(this.dataset.indice), 1); // Elimina el producto según su posición
        CartAPI.save(c); // Guarda cambios
        actualizarCarrito(); // Refresca la vista
      });
    });

    /* Calcular subtotal total y actualizar resumen */
    var subtotalTotal = carrito.reduce(function (suma, item) { // Suma todos los subtotales de productos
      return suma + item.price * item.qty;
    }, 0);
    actualizarResumen(subtotalTotal); // Envía el subtotal para calcular envío, IVA y total
  }

  /* ── Actualizar los valores del resumen ── */
  function actualizarResumen(subtotal) { // Calcula los valores finales del pedido
    /* Envío gratis si el pedido supera $200.000 */
    var envio = subtotal > 0 ? (subtotal >= 200000 ? 0 : 12000) : 0; // Calcula costo de envío según condición
    var iva   = Math.round(subtotal * 0.19); // Calcula IVA del 19%
    var total = subtotal + envio + iva; // Suma todo para el total final

    document.getElementById('valorSubtotal').textContent = formatearPrecio(subtotal); // Muestra subtotal
    document.getElementById('valorEnvio').textContent    = (envio === 0 && subtotal > 0) ? 'Gratis' : formatearPrecio(envio); // Muestra envío o "Gratis"
    document.getElementById('valorIva').textContent      = formatearPrecio(iva); // Muestra IVA
    document.getElementById('valorTotal').textContent    = formatearPrecio(total); // Muestra total final
  }

  /* ── Botón "Vaciar carrito" ── */
  document.getElementById('botonVaciar').addEventListener('click', function () { // Evento para vaciar todo el carrito
    if (confirm('¿Vaciar todo el carrito?')) { // Confirmación para evitar borrar por error
      CartAPI.save([]); // Guarda un carrito vacío (borra todo)
      actualizarCarrito(); // Actualiza la vista
    }
  });

  /* ── Botón "Finalizar Compra" ── */
  document.getElementById('botonPagar').addEventListener('click', function () { // Evento del botón pagar
    var carrito = CartAPI.load(); // Carga los productos actuales
    if (!carrito.length) { // Verifica que haya productos
      alert('Agrega productos al carrito primero.'); // Evita continuar vacío
      return;
    }
    var toast = document.getElementById('toast'); // Obtiene el elemento de notificación
    document.getElementById('toastMsg').textContent = 'Redirigiendo al pago seguro…'; // Mensaje al usuario
    toast.classList.add('show'); // Muestra el toast
    setTimeout(function () { toast.classList.remove('show'); }, 3000); // Lo oculta después de 3 segundos
  });

  /* Cargar el carrito al abrir la página */
  actualizarCarrito(); // Ejecuta todo al inicio para mostrar productos guardados automáticamente
});
</script>
